<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="site-title">TONIX AI PRO</title>
    <style>
        :root { --bg: #0a0a0a; --card: #161616; --accent: #3b82f6; --text: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        .page { display: none; height: 100%; width: 100%; flex-direction: column; background: var(--bg); }
        .active { display: flex; }
        #login-page { justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: var(--card); padding: 35px; border-radius: 24px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; }
        .login-logo { width: 80px; height: 80px; border-radius: 20px; margin-bottom: 15px; }
        input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #333; background: #000; color: #fff; outline: none; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; margin-top: 10px; }
        header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; background: #111; }
        #chat-content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 85%; font-size: 15px; padding: 12px; border-radius: 15px; line-height: 1.4; position: relative; }
        .user { align-self: flex-end; background: var(--accent); border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: #1a1a1a; border-bottom-left-radius: 2px; border: 1px solid #333; }
        #admin-panel { overflow-y: auto; padding: 20px; }
        .admin-box { background: #111; padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #222; }
    </style>
</head>
<body>

    <div id="login-page" class="page active">
        <div class="login-card">
            <img class="login-logo" src="https://cdn.corenexis.com/files/c/7934361720.webp">
            <h1 id="display-name">TONIX AI</h1>
            <p id="display-version" style="color: #666; margin-bottom: 20px;">PRO VERSION 1.1</p>
            <input type="email" id="u-mail" placeholder="Email Address">
            <input type="password" id="u-pass" placeholder="Password (Optional for users)">
            <button class="btn" onclick="handleLogin()">LOGIN</button>
        </div>
    </div>

    <div id="chat-page" class="page">
        <header>
            <span id="nav-title" style="font-weight: 700;">TONIX AI</span>
            <div style="font-size: 10px; color: #00ff00; text-align: right;">● LIVE<br><span id="user-count">Checking...</span></div>
        </header>
        <div id="chat-content"></div>
        <div style="padding: 15px; background: #111; display: flex; gap: 10px;">
            <input type="text" id="user-input" placeholder="Ask Tonix AI..." style="margin:0;">
            <button class="btn" onclick="askAI()" style="width: 60px; margin:0;">></button>
        </div>
    </div>

    <div id="admin-panel" class="page">
        <header>
            <span>ADMIN CONTROL</span>
            <button onclick="location.reload()" style="background:none; border:none; color:red;">Logout</button>
        </header>
        <div style="padding: 20px;">
            <div class="admin-box">
                <h3>System Settings</h3>
                <input type="text" id="set-name" placeholder="Website Name">
                <input type="text" id="set-logo" placeholder="Logo URL">
                <button class="btn" onclick="saveSettings()">Apply Changes</button>
            </div>
            <div class="admin-box">
                <h3>User Activity</h3>
                <div id="logs" style="font-size: 12px; color: #888;">No recent logins.</div>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "sk_j9lgfbp1_dqBwD8NdLylKxUkg6iLCrkz2"; // ഇങ്ങനെയുള്ള കീകൾ ഗിറ്റ്‌ഹബ്ബ് ബ്ലോക്ക് ചെയ്യാൻ സാധ്യതയുണ്ട്
        let settings = { name: "TONIX AI", logo: "https://cdn.corenexis.com/files/c/7934361720.webp" };

        function handleLogin() {
            const email = document.getElementById('u-mail').value;
            const pass = document.getElementById('u-pass').value;

            if (email === "admin@tonix.ai" && pass === "3007") {
                showPage('admin-panel');
            } else if (email.includes("@")) {
                showPage('chat-page');
                logUser(email);
            } else {
                alert("Please enter a valid email");
            }
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function logUser(email) {
            const logs = document.getElementById('logs');
            logs.innerHTML = `User ${email} joined at ${new Date().toLocaleTimeString()}<br>` + logs.innerHTML;
            document.getElementById('user-count').innerText = Math.floor(Math.random() * 10) + 1 + " Online";
        }

        async function askAI() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-content');
            if(!input.value) return;

            chat.innerHTML += `<div class="msg user">${input.value}</div>`;
            const prompt = input.value;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            // AI Logic here
            chat.innerHTML += `<div class="msg ai">Thinking...</div>`;
        }

        function saveSettings() {
            const newName = document.getElementById('set-name').value;
            if(newName) {
                document.getElementById('display-name').innerText = newName;
                document.getElementById('nav-title').innerText = newName;
                alert("Settings Updated (This session)");
            }
        }
    </script>
</body>
  </html>
